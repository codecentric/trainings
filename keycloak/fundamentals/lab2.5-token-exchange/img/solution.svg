<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7e22ce"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#f8fafc"/>

  <!-- Keycloak (top center) -->
  <g>
    <rect x="380" y="60" width="200" height="130" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <g transform="translate(456,72)">
      <path d="M24 5 L44 15 L44 40 L24 50 L4 40 L4 15 Z" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
      <path d="M24 5 L24 27 M4 15 L24 27 L44 15 M24 27 L24 50" fill="none" stroke="#1d4ed8" stroke-width="2"/>
    </g>
    <text x="480" y="160" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">Keycloak</text>
  </g>

  <!-- SPA (bottom left) -->
  <g>
    <rect x="60" y="380" width="150" height="120" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <rect x="87" y="402" width="96" height="54" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
    <rect x="96" y="411" width="78" height="10" rx="3" fill="#a7f3d0"/>
    <rect x="96" y="426" width="60" height="10" rx="3" fill="#a7f3d0"/>
    <rect x="96" y="441" width="70" height="8" rx="3" fill="#a7f3d0"/>
    <text x="135" y="485" text-anchor="middle" font-size="18" font-weight="bold" fill="#065f46">SPA</text>
  </g>

  <!-- Backend A (bottom center, below Keycloak) -->
  <g>
    <rect x="400" y="380" width="160" height="120" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <rect x="432" y="402" width="96" height="54" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <rect x="441" y="411" width="78" height="10" rx="3" fill="#fde68a"/>
    <rect x="441" y="426" width="60" height="10" rx="3" fill="#fde68a"/>
    <rect x="441" y="441" width="70" height="8" rx="3" fill="#fde68a"/>
    <text x="480" y="485" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400e">Backend A</text>
  </g>

  <!-- Backend B (bottom right) -->
  <g>
    <rect x="780" y="380" width="160" height="120" rx="12" fill="#fae8ff" stroke="#7e22ce" stroke-width="2"/>
    <rect x="812" y="402" width="96" height="54" rx="8" fill="#ffffff" stroke="#7e22ce" stroke-width="2"/>
    <rect x="821" y="411" width="78" height="10" rx="3" fill="#f5d0fe"/>
    <rect x="821" y="426" width="60" height="10" rx="3" fill="#f5d0fe"/>
    <rect x="821" y="441" width="70" height="8" rx="3" fill="#f5d0fe"/>
    <text x="860" y="485" text-anchor="middle" font-size="17" font-weight="bold" fill="#6b21a8">Backend B</text>
  </g>

  <!-- SPA <-> Keycloak: parallel pair, same length/slope -->
  <line x1="110" y1="378" x2="410" y2="190" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="190" x2="170" y2="378" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- SPA <-> Keycloak labels -->
  <text x="230" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151" transform="rotate(-32 230 285)">1: Login</text>
  <text x="313" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151" transform="rotate(-32 313 272)">2: Access token (aud: backend-a)</text>

  <!-- SPA -> Backend A -->
  <line x1="212" y1="440" x2="397" y2="440" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="304" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">3: Call with access token</text>

  <!-- Backend A <-> Keycloak: token exchange (vertical pair, no overlap) -->
  <line x1="460" y1="378" x2="460" y2="195" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="500" y1="195" x2="500" y2="378" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- exchange labels -->
  <text x="445" y="330" text-anchor="end" font-size="12" font-weight="bold" fill="#1d4ed8">4: Token Exchange</text>
  <text x="520" y="240" text-anchor="start" font-size="12" font-weight="bold" fill="#1d4ed8">5: Downscoped token (sub = user)</text>

  <!-- Backend A -> Backend B with exchanged token -->
  <g>
    <rect x="595" y="350" width="160" height="66" rx="10" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="675" y="377" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#111827">"sub": "user",</text>
    <text x="675" y="399" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#7e22ce">"aud": ["backend-b"]</text>
  </g>
  <line x1="562" y1="440" x2="777" y2="440" stroke="#7e22ce" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <line x1="675" y1="420" x2="675" y2="432" stroke="#7e22ce" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="669" y="472" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">6: Call with exchanged token</text>
</svg>
