<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#f8fafc"/>

  <!-- Keycloak -->
  <g>
    <rect x="60" y="210" width="170" height="120" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <g transform="translate(115,225)">
      <path d="M30 6 L54 18 L54 48 L30 60 L6 48 L6 18 Z" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
      <path d="M30 6 L30 32 M6 18 L30 32 L54 18 M30 32 L30 60" fill="none" stroke="#1d4ed8" stroke-width="2"/>
    </g>
    <text x="145" y="315" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">Keycloak</text>
  </g>

  <!-- SPA -->
  <g>
    <rect x="360" y="210" width="150" height="120" rx="12" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
    <rect x="387" y="232" width="96" height="54" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
    <rect x="396" y="241" width="78" height="10" rx="3" fill="#a7f3d0"/>
    <rect x="396" y="256" width="60" height="10" rx="3" fill="#a7f3d0"/>
    <rect x="396" y="271" width="70" height="8" rx="3" fill="#a7f3d0"/>
    <text x="435" y="315" text-anchor="middle" font-size="18" font-weight="bold" fill="#065f46">SPA</text>
  </g>

  <!-- Backend A -->
  <g>
    <rect x="620" y="210" width="150" height="120" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <rect x="647" y="232" width="96" height="54" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <rect x="656" y="241" width="78" height="10" rx="3" fill="#fde68a"/>
    <rect x="656" y="256" width="60" height="10" rx="3" fill="#fde68a"/>
    <rect x="656" y="271" width="70" height="8" rx="3" fill="#fde68a"/>
    <text x="695" y="315" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400e">Backend A</text>
  </g>

  <!-- Backend B -->
  <g>
    <rect x="620" y="400" width="150" height="110" rx="12" fill="#fae8ff" stroke="#7e22ce" stroke-width="2"/>
    <rect x="647" y="418" width="96" height="54" rx="8" fill="#ffffff" stroke="#7e22ce" stroke-width="2"/>
    <rect x="656" y="427" width="78" height="10" rx="3" fill="#f5d0fe"/>
    <rect x="656" y="442" width="60" height="10" rx="3" fill="#f5d0fe"/>
    <rect x="656" y="457" width="70" height="8" rx="3" fill="#f5d0fe"/>
    <text x="695" y="498" text-anchor="middle" font-size="17" font-weight="bold" fill="#6b21a8">Backend B</text>
  </g>

  <!-- token box (user token at the SPA) -->
  <g>
    <rect x="352" y="372" width="166" height="96" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="435" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">Access Token</text>
    <text x="435" y="428" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#111827">"sub": "user",</text>
    <text x="435" y="448" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#b91c1c">"aud": ["backend-a"]</text>
  </g>

  <!-- arrows -->
  <!-- SPA -> Keycloak (token request) -->
  <line x1="355" y1="250" x2="232" y2="250" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="294" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">1: Login</text>
  <!-- Keycloak -> SPA (token) -->
  <line x1="232" y1="295" x2="355" y2="295" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="294" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">2: Access token</text>
  <!-- SPA holds token -->
  <line x1="435" y1="332" x2="435" y2="367" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- SPA -> Backend A -->
  <line x1="512" y1="270" x2="616" y2="270" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="565" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">3: Call</text>
  <!-- Backend A -> Backend B: FORWARDS the same token (problem) -->
  <path d="M 695 332 L 695 395" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-red)"/>
  <text x="675" y="372" text-anchor="end" font-size="12" font-weight="bold" fill="#b91c1c">4: Forwards same token</text>
  <!-- Backend A -> Backend B: FORWARDS the same token (problem) -->
  <path d="M 695 332 L 695 395" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrow-red)"/>
  <!-- token box near Backend A showing forwarded token -->
  <g>
    <rect x="760" y="352" width="186" height="60" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="853" y="377" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#b91c1c">same token:</text>
    <text x="853" y="397" text-anchor="middle" font-size="13" font-family="Consolas, monospace" fill="#b91c1c">"aud": ["backend-a"]</text>
  </g>
  <path d="M 750 330 C 775 335 780 342 800 350" stroke="#b91c1c" stroke-width="1.5" fill="none" marker-end="url(#arrow-red)"/>
</svg>
