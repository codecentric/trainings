name: kc-fundamentals-lab2-5
services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    environment:

      # Keycloak Admin User
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      # Logging, see: https://www.keycloak.org/server/logging
      KC_LOG_LEVEL: INFO

    volumes:
      - keycloak-data:/opt/keycloak/data:z  # Keycloak h2 database, not for production!

    ports:
      - "8080:8080"   # HTTP

    networks:
      - backend

    command:
      - "--verbose"
      - "start-dev" # Only for Dev-Environment!

  # Imports the preconfigured realm `labrealm` (clients, mappers, user) on startup
  keycloak-config:
    depends_on:
      - keycloak
    image: adorsys/keycloak-config-cli:latest-26.1.0
    environment:
      KEYCLOAK_URL: "http://keycloak:8080/"
      KEYCLOAK_USER: "admin"
      KEYCLOAK_PASSWORD: "admin"
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: true
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: '/config/*'
    volumes:
      - ./config:/config
    networks:
      - backend
    restart: "no"

networks:
  backend:

volumes:
  keycloak-data:
