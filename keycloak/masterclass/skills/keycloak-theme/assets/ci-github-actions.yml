# .github/workflows/theme-test.yml
# Boots Keycloak with the theme mounted and runs the UI + accessibility suite.
# Adapt: KC_VERSION (keep it equal to the Dockerfile pin), realm import path, test user.
name: Theme tests

on:
  push:
    paths: ['themes/**', 'demo/**', '.github/workflows/theme-test.yml']
  pull_request:
    paths: ['themes/**', 'demo/**']

jobs:
  ui:
    runs-on: ubuntu-latest
    env:
      KC_VERSION: '26.7.2'
      KC_URL: http://localhost:8080
      KC_REALM: demo
      KC_USER: tester
      KC_PASS: test
    steps:
      - uses: actions/checkout@v4

      - name: Start Keycloak with the theme mounted
        run: |
          docker run -d --name kc -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_SPI_THEME_STATIC_MAX_AGE=-1 \
            -e KC_SPI_THEME_CACHE_THEMES=false \
            -e KC_SPI_THEME_CACHE_TEMPLATES=false \
            -v "$PWD/themes:/opt/keycloak/themes:ro" \
            -v "$PWD/local:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:${KC_VERSION} start-dev --import-realm

      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 60); do
            curl -sf "$KC_URL/realms/master" >/dev/null && exit 0
            sleep 2
          done
          docker logs kc; exit 1

      - name: Fail on FreeMarker template errors
        run: |
          if docker logs kc 2>&1 | grep -iE "freemarker|failed to (process|render) template"; then
            echo "::error::template errors in the Keycloak log"; exit 1
          fi

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install test deps
        run: npm ci || npm i -D @playwright/test @axe-core/playwright

      - run: npx playwright install --with-deps chromium

      - name: Run UI and accessibility tests
        run: npx playwright test

      - name: Re-check the log after the test run
        if: always()
        run: docker logs kc 2>&1 | tail -200

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
