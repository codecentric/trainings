# themes/<name>/login/theme.properties
parent=base

styles=css/styles.css
scripts=js/script.js

# Only needed when the layout comes from the parent; a custom template.ftl writes the tag itself.
meta=viewport==width=device-width,initial-scale=1

# Enable together with realm -> Localization -> Internationalization
locales=de,en

# Custom keys are readable as ${properties.kcXyz!} inside templates
kcLogoLink=https://example.com
kcImprintUrl=https://example.com/impressum
kcPrivacyUrl=https://example.com/datenschutz
