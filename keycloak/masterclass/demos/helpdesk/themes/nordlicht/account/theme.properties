# ============================================================
# Nordlicht Energie AG - Account-Console-Theme
# Keycloak 26.7.3, Typ "account"
# ============================================================
# Die Account-Console ist - wie die Admin-Console - eine React-SPA
# auf PatternFly v5. Es gelten dieselben Regeln:
#
# 1) KEIN eigenes index.ftl (laedt sonst die Vite-Assets des
#    Parents nicht mehr -> weisse Seite).
# 2) styles listet NUR die eigene Datei; keycloak.v3/account hat
#    kein styles-Property, seine CSS kommt ueber assets/*.
#
# Unterschied zur Admin-Console: Hier wird das Logo ueber eine
# Join-Funktion aufgeloest (Default "logo.svg" ohne Slash), der
# fuehrende Slash ist also optional. Wir schreiben ihn trotzdem,
# damit beide Themes gleich aussehen.
# ============================================================

parent=keycloak.v3

styles=css/nordlicht-account.css

logo=/img/nordlicht-logo.svg

title=Nordlicht Energie AG - Mein Konto
description=Kontoverwaltung der Nordlicht Energie AG

favIcon=img/favicon.svg
favIconType=image/svg+xml

darkMode=false
