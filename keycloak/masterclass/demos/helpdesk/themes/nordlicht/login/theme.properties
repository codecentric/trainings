# ============================================================
# Nordlicht Energie AG - Login-Theme
# Keycloak 26.7.3, Typ "login"
# ============================================================
# Dieses Theme faerbt die Login-Seite des Realms "helpdesk" -
# und damit auch den Login zur Realm-Admin-Console unter
# /admin/helpdesk/console/, denn der laeuft ueber den Client
# security-admin-console INNERHALB des Realms.
# ============================================================

parent=keycloak.v2
import=common/keycloak

# Erster Eintrag ist das Stylesheet des Eltern-Themes (keycloak.v2),
# danach unsere Overrides. Ohne den ersten Eintrag verliert man das
# komplette PatternFly-Layout.
styles=css/styles.css css/nordlicht-login.css

# Sprachumschalter; korrespondiert mit internationalizationEnabled
# im Realm-Import.
locales=de,en

# Corporate Design ist fuer ein Farbschema gepflegt - kein Dark Mode.
darkMode=false
