# ============================================================
# Nordlicht Energie AG - Admin-Console-Theme
# Keycloak 26.7.3, Typ "admin"
# ============================================================
# Wichtig, und anders als beim Login-Theme:
#
# 1) KEIN eigenes index.ftl. Die Admin-Console ist eine React-SPA;
#    ihr index.ftl laedt die kompilierten Vite-Assets des Parents.
#    Ein eigenes Template ersetzt es und liefert eine weisse Seite.
#
# 2) styles listet NUR die eigene Datei. keycloak.v2/admin hat kein
#    styles-Property - seine CSS kommt ueber die gehashten assets/*.
#    Wer hier zusaetzlich css/styles.css auffuehrt, erzeugt einen 404.
#    Unser <link> wird nach den Vite-Assets injiziert und gewinnt daher.
# ============================================================

parent=keycloak.v2

styles=css/nordlicht-admin.css

# Wortmarke im Masthead UND als Icon auf der Dashboard-Startseite.
# Der fuehrende Slash ist Pflicht: die Dashboard-Seite baut die URL als
# resourceUrl + logo per String-Konkatenation zusammen (der Masthead
# normalisiert dagegen). Keycloaks eigene Defaults heissen deshalb
# ebenfalls /logo.svg bzw. /icon.svg.
logo=/img/nordlicht-logo.svg

title=Nordlicht Energie AG - Verwaltung
description=Benutzerverwaltung der Nordlicht Energie AG

favIcon=img/favicon.svg
favIconType=image/svg+xml

# Fixiert das Erscheinungsbild unabhaengig von prefers-color-scheme.
darkMode=false
